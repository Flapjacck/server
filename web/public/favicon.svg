<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      /* Tile adapts to the browser chrome's color scheme */
      @media (prefers-color-scheme: light) {
        .tile { fill: #f4f4f5; }
      }
      @media (prefers-color-scheme: dark) {
        .tile { fill: #09090b; }
      }
    </style>
  </defs>

  <!-- Rounded tile background -->
  <rect class="tile" width="32" height="32" rx="7" fill="#09090b"/>

  <!-- O ring — the O from OWS, geometric ring in accent red.
       Two concentric circles with fill-rule:evenodd cut the inner circle out. -->
  <path
    fill="#BF1A2F"
    fill-rule="evenodd"
    d="M16 4C9.373 4 4 9.373 4 16s5.373 12 12 12 12-5.373 12-12S22.627 4 16 4zm0 4.5a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15z"
  />
</svg>
