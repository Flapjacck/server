version: "3.9"

services:
  # Express API backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: secure-api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - API_KEYS=${API_KEYS}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    ports:
      - "3000:3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./api/src:/app/src:ro
    labels:
      - "app=secure-api"

  # Nginx reverse proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: secure-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - internal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "app=secure-api"

  # Cloudflare Tunnel (optional for local dev, required for production)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: secure-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - CLOUDFLARED_TOKEN=${CLOUDFLARED_TOKEN}
    networks:
      - internal
    depends_on:
      - nginx
    profiles:
      - prod
    labels:
      - "app=secure-api"

networks:
  internal:
    driver: bridge
