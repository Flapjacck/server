services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - server-net

  judge-runner:
    build: ./api/judge/runner-image
    image: ows-judge-runner:local
    profiles:
      - judge

  api:
    build: ./api
    container_name: ows-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_submissions:/tmp/judge-submissions
    environment:
      PORT: 3000
      JUDGE_API_KEYS: ${JUDGE_API_KEYS:-}
      JUDGE_RUNNER_IMAGE: ${JUDGE_RUNNER_IMAGE:-ows-judge-runner:local}
      JUDGE_MAX_CONCURRENT: ${JUDGE_MAX_CONCURRENT:-8}
      JUDGE_RUN_TIMEOUT_MS: ${JUDGE_RUN_TIMEOUT_MS:-8000}
      JUDGE_RATE_LIMIT_PER_MIN: ${JUDGE_RATE_LIMIT_PER_MIN:-20}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - server-net

  web:
    build: ./web
    container_name: ows-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - server-net

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: server-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - server-net

networks:
  server-net:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  judge_submissions:
